    <!-- FORMULARIO DE INICIO DE SESION -->

    <div class="sesion-contenedor">

        <h1 class="sesion-titulo">
            Inicio de sesión
        </h1>

        <p class="sesion-descripcion">
            Ingresa con el correo y la contraseña de tu cuenta.
        </p>

        <form method="post">

            <label for="correo" class="sesion-label">
                correo electronico
            </label>

            <br><br>

            <input type="email" id="correo" name="correo" class="sesion-input">

            <br><br>

            <label for="contrasena" class="sesion-label">
                ingrese su contraseña
            </label>

            <br><br>

            <input type="password" id="contrasena" name="contrasena" class="sesion-input">

            <br><br>

            <button type="submit" class="sesion-boton">
                Iniciar sesion
            </button>

        </form>

    </div>
